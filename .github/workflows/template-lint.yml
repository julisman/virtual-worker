# Reusable template-lint job for Virtual Worker template registries.
#
# A registry repository calls this workflow (see
# registry-scaffold/.github/workflows/lint.yml) and pins `lint_ref` to an
# immutable Virtual Worker tag or full commit SHA, never `main`. The lint
# implementation is checked out from that ref; the registry's own checkout is
# the working directory so version-bump checks can resolve the PR merge-base.
name: Template lint (reusable)

on:
  workflow_call:
    inputs:
      lint_ref:
        description: Virtual Worker tag or commit SHA that provides tools/template-lint
        required: true
        type: string
      lint_repo:
        description: Repository that provides tools/template-lint
        required: false
        type: string
        default: ${{ github.repository }}
      manifests:
        description: Glob of manifests to lint, relative to the registry root
        required: false
        type: string
        default: templates/*/template.json

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the registry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the pinned lint tool
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.lint_repo }}
          ref: ${{ inputs.lint_ref }}
          path: .vw-lint
          sparse-checkout: |
            tools/template-lint
            backend/storage/template_manifest.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint
        env:
          TEMPLATE_LINT_TARGET_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: python .vw-lint/tools/template-lint/lint.py lint ${{ inputs.manifests }}
